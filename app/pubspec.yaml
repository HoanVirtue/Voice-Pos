name: banhang_app
description: "Ban hang bang giong noi - app cho quay ban thit lon."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # Bo dich Material/Cupertino cho locale vi_VN.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4

  # Network
  dio: ^5.4.3

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.6
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  connectivity_plus: ^6.0.3

  # Voice
  record: ^7.0.0
  web_socket_channel: ^3.0.1
  flutter_tts: ^4.0.2
  wakelock_plus: ^1.2.8
  audio_session: ^0.1.21

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  logger: ^2.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.20.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
